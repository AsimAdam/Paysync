name: Basic CI

on:
  push:
    branches: [ prod ]
  pull_request:
    branches: [ prod ]

jobs:
  checkout-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3 


      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
            node-version: '20'
            cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile